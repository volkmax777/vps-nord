name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Syntax
        run: bash -n nord_install.sh
      - name: Shellcheck installer and tests
        run: >
          shellcheck -S style nord_install.sh tests/*.sh tests/e2e/*.sh
          tests/e2e/mock/curl tests/e2e/mock/systemctl tests/e2e/mock/sysctl
      - name: Shellcheck the embedded CLI
        run: |
          awk '/^cat > "\$CLI.new" <<.NORD_CLI_EOF.$/{f=1;next} /^NORD_CLI_EOF$/{f=0} f' \
            nord_install.sh > "$RUNNER_TEMP/cli.sh"
          test -s "$RUNNER_TEMP/cli.sh"
          shellcheck -S style "$RUNNER_TEMP/cli.sh"

  handshake:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install wireguard-tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools && sudo modprobe wireguard
      - name: New behaviour hands over within seconds
        run: sudo unshare -n tests/handshake.sh new
      - name: Old behaviour gets no handshake (the guarded bug)
        run: "! sudo unshare -n tests/handshake.sh old"

  e2e:
    runs-on: ubuntu-24.04
    needs: shellcheck
    steps:
      - uses: actions/checkout@v4
      - name: Load the WireGuard module
        run: sudo modprobe wireguard
      - name: End-to-end scenario in a Debian container
        env:
          ENGINE: docker
        run: tests/e2e/run.sh

  release:
    # A tag v* publishes a release only after every check passed on it. The
    # asset is the installer with VERSION stamped; `vps-nord update` and the
    # install one-liner download it via releases/latest/download.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [shellcheck, handshake, e2e]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Stamp the version
        run: |
          sed -i "s/^VERSION=\"dev\"$/VERSION=\"${GITHUB_REF_NAME}\"/" nord_install.sh
          grep -qx "VERSION=\"${GITHUB_REF_NAME}\"" nord_install.sh
          bash -n nord_install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nord_install.sh --title "$GITHUB_REF_NAME" --generate-notes
